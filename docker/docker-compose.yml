version: '3.8'

services:
  server:
    build:
      context: ../server
    ports:
      - "3001:3001"
    networks:
      - collab-network

  client:
    build:
      context: ../client
    ports:
      - "3000:3000"
    networks:
      - collab-network

  execution-service:
    build:
      context: ../execution-service
    ports:
      - "3002:3002"
    volumes:
      - //./pipe/docker_engine://./pipe/docker_engine
    networks:
      - collab-network

networks:
  collab-network:
    driver: bridge
